<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciar Pedidos | Baozeira</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --vermelho:#E63946;
    --vermelho-hover:#C92F3B;
    --amarelo:#FFD166;
    --creme:#FFF8F0;
    --branco:#FFFFFF;
    --preto:#222222;
    --cinza:#666666;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:var(--creme);
}

header{
    background:var(--vermelho);
    color:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.8rem;
    font-weight:700;
}

.voltar{
    background:var(--amarelo);
    color:var(--preto);
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
}

.container{
    max-width:1300px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:var(--branco);
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

h1{
    color:var(--vermelho);
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#fff0f1;
    color:var(--vermelho);
}

th,td{
    padding:15px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.status{
    border:none;
    padding:8px;
    border-radius:8px;
    font-weight:600;
}

.preparo{
    background:#fff3cd;
}

.entrega{
    background:#cfe2ff;
}

.entregue{
    background:#d1e7dd;
}

.btn{
    background:var(--vermelho);
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.btn:hover{
    background:var(--vermelho-hover);
}

.total{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.box h3{
    color:var(--cinza);
}

.numero{
    font-size:2rem;
    color:var(--vermelho);
    font-weight:bold;
    margin-top:10px;
}

@media(max-width:900px){

header{
    flex-direction:column;
    gap:15px;
}

table{
    display:block;
    overflow-x:auto;
}

}

</style>
</head>
<body>

<header>

    <div class="logo">
        📦 Baozeira Admin
    </div>

    <a href="painel.html" class="voltar">
        ⬅ Voltar ao Painel
    </a>

</header>

<div class="container">

    <div class="total">

        <div class="box">
            <h3>Pedidos Hoje</h3>
            <div class="numero">58</div>
        </div>

        <div class="box">
            <h3>Em Preparo</h3>
            <div class="numero">12</div>
        </div>

        <div class="box">
            <h3>Em Entrega</h3>
            <div class="numero">8</div>
        </div>

        <div class="box">
            <h3>Entregues</h3>
            <div class="numero">38</div>
        </div>

    </div>

    <div class="card">

        <h1>Lista de Pedidos</h1>

        <table>

            <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Produtos</th>
                <th>Total</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>

            <tr>
                <td>#1001</td>
                <td>Maria Silva</td>
                <td>Combo Sushi Premium</td>
                <td>R$ 48,90</td>

                <td>
                    <select class="status preparo">
                        <option>Em preparo</option>
                        <option>Saiu para entrega</option>
                        <option>Entregue</option>
                    </select>
                </td>

                <td>
                    <button class="btn">
                        Atualizar
                    </button>
                </td>
            </tr>

            <tr>
                <td>#1002</td>
                <td>João Santos</td>
                <td>Lámen Especial</td>
                <td>R$ 34,90</td>

                <td>
                    <select class="status entrega">
                        <option>Saiu para entrega</option>
                        <option>Em preparo</option>
                        <option>Entregue</option>
                    </select>
                </td>

                <td>
                    <button class="btn">
                        Atualizar
                    </button>
                </td>
            </tr>

            <tr>
                <td>#1003</td>
                <td>Ana Souza</td>
                <td>Bao Tradicional</td>
                <td>R$ 18,90</td>

                <td>
                    <select class="status entregue">
                        <option>Entregue</option>
                        <option>Em preparo</option>
                        <option>Saiu para entrega</option>
                    </select>
                </td>

                <td>
                    <button class="btn">
                        Atualizar
                    </button>
                </td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
