<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baozeira - O sabor do Brasil encontra a Ásia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#fff8f0;
    color:#333;
}

header{
    background:#e63946;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    color:white;
    font-size:1.5rem;
    font-weight:700;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:500;
    transition:0.3s;
}

nav a:hover{
    color:#ffd166;
}

.banner{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    background:linear-gradient(rgba(0,0,0,.4),
    rgba(0,0,0,.4)),
    url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c");
    background-size:cover;
    background-position:center;
}

.banner-content{
    color:white;
    max-width:700px;
}

.banner h1{
    font-size:3rem;
    margin-bottom:20px;
}

.banner p{
    font-size:1.1rem;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:#ffd166;
    color:#333;
    padding:12px 25px;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

section{
    padding:70px 8%;
}

.titulo{
    text-align:center;
    margin-bottom:40px;
    font-size:2rem;
    color:#e63946;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h3{
    margin-bottom:10px;
    color:#e63946;
}

.sobre{
    text-align:center;
    max-width:900px;
    margin:auto;
}

.promocao{
    background:#e63946;
    color:white;
    text-align:center;
}

.promocao .btn{
    margin-top:20px;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:30px;
}

footer p{
    margin-top:10px;
}

@media(max-width:768px){

header{
    flex-direction:column;
    gap:15px;
}

nav ul{
    flex-wrap:wrap;
    justify-content:center;
}

.banner h1{
    font-size:2rem;
}

}

</style>
</head>
<body>

<header>
    <div class="logo">🥟 Baozeira</div>

    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="cardapio.html">Cardápio</a></li>
            <li><a href="promocoes.html">Promoções</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="contato.html">Contato</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<section class="banner">
    <div class="banner-content">
        <h1>🥟 Baozeira</h1>
        <p>
            O sabor do Brasil encontra a Ásia. Experimente pratos incríveis,
            combinações exclusivas e uma experiência gastronômica única.
        </p>

        <a href="#" class="btn">Ver Cardápio</a>
    </div>
</section>

</body>
</html>
